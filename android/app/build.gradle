plugins {
    id 'com.android.application'
}

// CI provides a stable release key via env vars so every new APK can be installed
// over the previous one (keeping local data). Local builds fall back to the debug key.
def releaseKeystore = System.getenv("SIGNING_KEYSTORE_PATH")
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()

android {
    namespace 'com.porsche.genesis911'
    compileSdk 34

    defaultConfig {
        applicationId "com.porsche.genesis911"
        minSdk 24
        targetSdk 34
        versionCode 100 + buildNumber
        versionName "2.1.${buildNumber}"
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
