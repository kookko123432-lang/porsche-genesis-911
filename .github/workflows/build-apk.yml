name: Build Porsche 911 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Sync Web Assets into Android Asset Folder
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html porsche-ui.css app.js audio-engine.js data.js manifest.json android/app/src/main/assets/www/

      - name: Build Installable Android APK
        working-directory: ./android
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK Package
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ./porsche-genesis-911.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: porsche-genesis-911-apk
          path: ./porsche-genesis-911.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.911
          name: "MY PORSCHE : GENESIS 911 (Android APK + Home Screen Widget)"
          body: |
            ### PORSCHE DIGITAL // GENESIS 911 (2026.10.21 – 2029.04.18)
            - **Android 直接安裝檔**：下載下方 `porsche-genesis-911.apk` 即可直接安裝至 Android 手機。
            - **內建 Android 原生桌面小工具 (AppWidget)**：安裝後長按手機桌面 ➔「小工具 (Widgets)」➔ 選擇 **PORSCHE 911 // CHRONO WIDGET** 即可釘選在桌面。
          files: ./porsche-genesis-911.apk
