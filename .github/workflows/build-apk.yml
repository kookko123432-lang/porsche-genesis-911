name: Build Porsche 911 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Sync Web Assets into Android Asset Folder
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html porsche-ui.css app.js audio-engine.js data.js manifest.json android/app/src/main/assets/www/

      - name: Restore Release Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing; refusing to publish an APK signed with a throwaway key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        working-directory: ./android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Prepare APK Package
        run: cp android/app/build/outputs/apk/release/app-release.apk ./porsche-genesis-911.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: porsche-genesis-911-apk
          path: ./porsche-genesis-911.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: "GENESIS 911 · v2.1.${{ github.run_number }}"
          make_latest: true
          body: |
            ### MY PORSCHE : GENESIS 911 (2026.10.21 – 2029.04.18)
            - 下載下方 `porsche-genesis-911.apk` 直接安裝到 Android 手機。
            - 桌面小工具：長按主畫面 → 小工具 → **PORSCHE 911 // CHRONO WIDGET**。
            - 從 v2.1 起使用固定簽章，之後的版本可直接覆蓋安裝並保留資料。
          files: ./porsche-genesis-911.apk
