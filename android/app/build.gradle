plugins {
    id 'com.android.application'
}

android {
    namespace 'com.porsche.genesis911'
    compileSdk 34

    defaultConfig {
        applicationId "com.porsche.genesis911"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.0.911"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
